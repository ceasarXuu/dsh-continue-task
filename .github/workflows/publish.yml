name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Check OIDC environment
        run: |
          node -e "console.log('OIDC URL:', process.env.ACTIONS_ID_TOKEN_REQUEST_URL ? 'set' : 'missing'); console.log('OIDC token:', process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN ? 'set' : 'missing')"
          npm config get registry

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$version" = "$GITHUB_REF_NAME"

      - name: Check whether this version is already published
        id: check
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@ceasarxuu/dsh-continue-task@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
