name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$version" = "$GITHUB_REF_NAME"

      - name: Configure npm token when the repository provides one
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

      - name: Check whether this version is already published
        id: check
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@ceasarxuu/dsh-continue-task@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
